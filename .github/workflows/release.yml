name: Release

# Ao publicar uma tag de versão (ex.: v2.0.0), gera o executável do Windows a partir
# do repositório limpo, testa e anexa a uma release do GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  executavel-windows:
    name: Executável Windows
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e ".[dev,ferramentas]"

      - name: Testes
        run: pytest -q

      - name: Gerar e testar o executável
        run: python ferramentas/empacotar.py

      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="docs/notas-${GITHUB_REF_NAME}.md"
          if [ -f "$notas" ]; then
            gh release create "$GITHUB_REF_NAME" dist/Cobrinha.exe \
              --title "Jogo da Cobrinha ${GITHUB_REF_NAME}" --notes-file "$notas"
          else
            gh release create "$GITHUB_REF_NAME" dist/Cobrinha.exe \
              --title "Jogo da Cobrinha ${GITHUB_REF_NAME}" --generate-notes
          fi
